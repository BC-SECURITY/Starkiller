repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: pnpm-lint
        name: pnpm-lint
        entry: bash -c 'pnpm lint'
        language: system
      - id: pnpm-format
        name: pnpm-format
        entry: bash -c 'pnpm format'
        language: system
